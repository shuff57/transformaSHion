<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>transformaSHion</title>
<link rel="stylesheet" href="src/plotter.css">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 0.75rem 1rem; background: #f5f3ea; color: #141413; font: 16px/1.45 ui-serif, Georgia, serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #26241d; color: #faf9f5; } }
  [data-theme="dark"] body { background: #26241d; color: #faf9f5; }
  main { max-width: 90rem; margin: 0 auto; }
  h1 { margin: 0 0 0.2rem; }
  .lede { margin: 0 0 0.6rem; font-style: italic; }
  /* The grid is square, so its width is also its height: cap it by the viewport
     height and the title, grid and toolbar fit one screen without scrolling. */
  #app { max-width: min(60rem, calc(100vh - 9.75rem)); margin: 0.4rem auto 0; }   /* 13rem of page chrome, less the 3.25rem sidebar that shares the grid's row */
  /* On a wide screen the Settings sidebar (17rem + 0.5rem gap) is mirrored by an empty column on the left so the grid is centered;
     the page is 2 x 17.5rem wider than the grid, which keeps the size that fits the screen. */
  @media (min-width: 60rem) { #app { max-width: min(90rem, calc(100vh + 21.75rem)); } }
</style>
</head>
<body>
<main>
  <h1>transformaSHion</h1>
  <p class="lede">A plain graphing grid. Plot a figure with the Line, Dot and Polygon tools, then turn on the paper, mark points on it, and slide, turn or flip it. The tool never says which move is right.</p>
  <div id="app" class="pl-bare"></div>
</main>
<script src="src/plotter.js"></script>
<script>
  // ?preset=parallel or #parallel picks a starting grid
  var want = new URLSearchParams(location.search).get("preset") || location.hash.replace(/^#/, "");
  window.plotter = Plotter.mount(document.getElementById("app"), { presets: Plotter.presets, preset: want || undefined });
</script>
</body>
</html>
