<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracing Paper</title>
<style>
/* Tracing Paper: styles. Tokens first; light by default, dark under prefers-color-scheme or [data-theme="dark"]. */
.tp-root, .tp-overlay, .tp-fab {
  --tp-ink: #141413; --tp-curve: #3d5a80; --tp-accent: #b3520f; --tp-axis: #504e49; --tp-bg: #f5f3ea;
  --tp-panel: #ffffff; --tp-line: #cfcabd; --tp-paper: rgba(255, 244, 196, 0.55); --tp-paper-back: rgba(214, 226, 240, 0.6);
}
:root[data-theme="dark"] .tp-root, :root[data-theme="dark"] .tp-overlay, :root[data-theme="dark"] .tp-fab,
[data-theme="dark"] .tp-root, [data-theme="dark"] .tp-overlay, [data-theme="dark"] .tp-fab {
  --tp-ink: #faf9f5; --tp-curve: #7a9bbf; --tp-accent: #e0a96d; --tp-axis: #87867f; --tp-bg: #26241d;
  --tp-panel: #2f2c24; --tp-line: #55524a; --tp-paper: rgba(224, 196, 110, 0.28); --tp-paper-back: rgba(122, 155, 191, 0.3);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.tp-page-themed) .tp-root, :root:not([data-theme="light"]):not(.tp-page-themed) .tp-overlay, :root:not([data-theme="light"]):not(.tp-page-themed) .tp-fab {
    --tp-ink: #faf9f5; --tp-curve: #7a9bbf; --tp-accent: #e0a96d; --tp-axis: #87867f; --tp-bg: #26241d;
    --tp-panel: #2f2c24; --tp-line: #55524a; --tp-paper: rgba(224, 196, 110, 0.28); --tp-paper-back: rgba(122, 155, 191, 0.3);
  }
}

.tp { display: grid; grid-template-columns: minmax(0, 1fr) 21rem; grid-template-rows: auto 1fr; column-gap: 1rem; align-items: start; color: var(--tp-ink);
  font: 15px/1.4 ui-serif, Georgia, "Times New Roman", serif; }
.tp-head { grid-column: 1; grid-row: 1; min-width: 0; }
.tp-pin { grid-column: 1; grid-row: 2; min-width: 0; position: sticky; top: var(--tp-top, 0.5rem); z-index: 2; background: var(--tp-bg); padding-bottom: 0.3rem; }
.tp-side { grid-column: 2; grid-row: 1 / span 2; }
@media (max-width: 880px) {
  .tp { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  .tp-head, .tp-pin, .tp-side { grid-column: 1; grid-row: auto; }
  .tp-pin { box-shadow: 0 6px 8px -6px rgba(0, 0, 0, 0.35); margin-bottom: 0.6rem; }
  .tp-side { margin-top: 0; }
}
.tp-title { margin: 0 0 0.25rem; font-size: 1.2rem; }
.tp-note { margin: 0 0 0.5rem; font-style: italic; }
.tp-svg { display: block; width: 100%; height: auto; background: var(--tp-bg); border: 1px solid var(--tp-line); border-radius: 8px;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
.tp-svg:focus-visible { outline: 3px solid var(--tp-curve); outline-offset: 2px; }
.tp-live { min-height: 1.4em; max-height: 3.8em; overflow: auto; margin: 0.35rem 0 0; font-size: 0.92rem; font-style: italic; color: var(--tp-ink); }

.tp-side { display: flex; flex-direction: column; gap: 0.6rem; color: var(--tp-ink); }
.tp-tabs { display: flex; gap: 0.2rem; border-bottom: 1.5px solid var(--tp-line); }
.tp-tab { flex: 1; font: inherit; color: var(--tp-ink); background: none; border: 1.5px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0;
  padding: 0.4rem 0.2rem; margin-bottom: -1.5px; cursor: pointer; }
.tp-tab:hover { color: var(--tp-accent); }
.tp-tab[aria-selected="true"] { background: var(--tp-panel); border-color: var(--tp-line); color: var(--tp-accent); font-weight: 700; }
.tp-tab[hidden], .tp-panel[hidden] { display: none; }
.tp-tab:focus-visible { outline: 3px solid var(--tp-curve); outline-offset: -2px; }
.tp-panel { display: flex; flex-direction: column; gap: 0.6rem; }
.tp-group { background: var(--tp-panel); border: 1px solid var(--tp-line); border-radius: 8px; padding: 0.55rem 0.7rem; }
.tp-group h3 { margin: 0 0 0.35rem; font-size: 0.95rem; color: var(--tp-accent); }
.tp-row { display: flex; flex-wrap: wrap; gap: 0.35rem 0.4rem; align-items: center; margin: 0.25rem 0; }
.tp-lab { opacity: 0.85; }
.tp-val { font-weight: 700; }
.tp-hint { margin: 0.25rem 0 0; font-size: 0.85rem; opacity: 0.8; font-style: italic; }
.tp-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 0.2rem 0.6rem; margin: 0.35rem 0; }
.tp-mode, .tp-snap { display: flex; gap: 0.4rem; align-items: center; cursor: pointer; }
.tp-btn { font: inherit; color: var(--tp-ink); background: var(--tp-bg); border: 1.5px solid var(--tp-axis); border-radius: 6px;
  padding: 0.3rem 0.65rem; cursor: pointer; }
.tp-btn:hover:not(:disabled) { border-color: var(--tp-accent); }
.tp-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.tp-btn:focus-visible, .tp-num:focus-visible, .tp-text:focus-visible, .tp-sel:focus-visible, .tp-mode input:focus-visible {
  outline: 3px solid var(--tp-curve); outline-offset: 2px; }
.tp-primary { background: var(--tp-accent); color: var(--tp-bg); border-color: var(--tp-accent); font-weight: 700; }
.tp-num, .tp-text, .tp-sel { font: inherit; color: var(--tp-ink); background: var(--tp-bg); border: 1.5px solid var(--tp-axis); border-radius: 6px; padding: 0.2rem 0.35rem; }
.tp-text, .tp-sel { width: 100%; box-sizing: border-box; margin: 0.15rem 0; }
.tp-table table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.tp-table th, .tp-table td { text-align: left; padding: 0.15rem 0.3rem; border-bottom: 1px solid var(--tp-line); color: var(--tp-ink); background: transparent; }
.tp-table thead th { background: var(--tp-bg); }
.tp-moves { margin: 0 0 0.4rem; padding-left: 1.3rem; }
.tp-none { list-style: none; margin-left: -1.3rem; opacity: 0.7; font-style: italic; }
.tp-checkmsg { min-height: 1.4em; margin: 0.35rem 0 0; font-weight: 700; }

/* the drawing */
.tp-grid { stroke: var(--tp-axis); stroke-width: 0.75; opacity: 0.45; }
.tp-axis { stroke: var(--tp-axis); stroke-width: 2; }
.tp-tick { fill: var(--tp-ink); opacity: 0.5; font: 12px ui-serif, Georgia, serif; text-anchor: middle; }
.tp-tick.tp-end { text-anchor: end; }
.tp-axl { fill: var(--tp-ink); font: italic 15px ui-serif, Georgia, serif; }
.tp-guide { stroke: var(--tp-ink); stroke-width: 1.6; stroke-dasharray: 3 6; opacity: 0.5; }
.tp-pre { fill: var(--tp-curve); fill-opacity: 0.2; stroke: var(--tp-curve); stroke-width: 2.6; stroke-linejoin: round; }
.tp-ref { fill: none; stroke: var(--tp-axis); stroke-width: 1.8; stroke-dasharray: 5 4; }
.tp-paper { fill: var(--tp-paper); stroke: var(--tp-accent); stroke-width: 2; stroke-dasharray: 9 5; pointer-events: none; }
.tp-paper.tp-back { fill: var(--tp-paper-back); stroke: var(--tp-curve); }
.tp-hatch { stroke: var(--tp-curve); stroke-width: 1.2; }
.tp-fold { fill: var(--tp-accent); fill-opacity: 0.5; stroke: var(--tp-accent); stroke-width: 1.5; }
.tp-mark { fill: var(--tp-accent); fill-opacity: 0.14; stroke: var(--tp-accent); stroke-width: 2.6; stroke-linejoin: round; }
polyline.tp-mark { fill: none; }
.tp-dot { fill: var(--tp-accent); stroke: var(--tp-ink); stroke-width: 1; }
.tp-plbl { fill: var(--tp-accent); font: 700 13px ui-serif, Georgia, serif; }
.tp-mirror { stroke: var(--tp-ink); stroke-width: 2.6; stroke-dasharray: 10 6; }
.tp-pend { fill: none; stroke: var(--tp-ink); stroke-width: 2.4; }
.tp-center { fill: var(--tp-bg); stroke: var(--tp-ink); stroke-width: 2.6; }
.tp-clbl { fill: var(--tp-curve); font: 700 13px ui-serif, Georgia, serif; }

/* modal */
.tp-overlay { position: fixed; inset: 0; z-index: 10000; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; padding: 1rem; }
.tp-dialog { position: relative; background: var(--tp-bg); color: var(--tp-ink); border-radius: 12px; max-width: 78rem; width: 100%; max-height: 100%; overflow: auto; padding: 2.6rem 1rem 1rem; }
.tp-close { position: absolute; top: 0.6rem; right: 0.7rem; }
.tp-fab { position: fixed; right: 1rem; bottom: 1rem; z-index: 9000; }
@media (pointer: coarse) { .tp-tab { min-height: 44px; } .tp-btn, .tp-num, .tp-sel, .tp-text { min-height: 44px; } .tp-mode { min-height: 36px; } }
@media (prefers-reduced-motion: reduce) { .tp-svg * { transition: none !important; } }

/* built into the page */
.tp-inline { margin: 1.5rem 0; padding: 0.75rem; border: 1px solid var(--tp-line, #cfcabd); border-radius: 12px; background: var(--tp-bg, transparent); color: var(--tp-ink); }
</style>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 1rem; background: #f5f3ea; color: #141413; font: 16px/1.45 ui-serif, Georgia, serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #26241d; color: #faf9f5; } }
  [data-theme="dark"] body { background: #26241d; color: #faf9f5; }
  main { max-width: 80rem; margin: 0 auto; }
  h1 { margin: 0 0 0.2rem; }
  .lede { margin: 0 0 1rem; font-style: italic; }
</style>
</head>

      return [S.P.xr[0] + (vx - ML) / CELL, S.P.yr[1] - (vy - MT) / CELL];
    }
    function snapPt(p) { return S.snap ? [Math.round(p[0]), Math.round(p[1])] : [Math.round(p[0] * 100) / 100, Math.round(p[1] * 100) / 100]; }
    function inPlane(p) { return p[0] >= S.P.xr[0] - 0.5 && p[0] <= S.P.xr[1] + 0.5 && p[1] >= S.P.yr[0] - 0.5 && p[1] <= S.P.yr[1] + 0.5; }

    ui.svg.addEventListener("pointerdown", function (ev) {
      if (S.busy) return;
      var w = toWorld(ev); if (!inPlane(w)) return;
      var p = snapPt(w);
      if (S.mode === "move") {
        if (!S.paper) { say("Lay the tracing paper on the grid first."); return; }
        S.drag = { start: w, M0: S.M, M: S.M, dx: 0, dy: 0 };
        ui.svg.setPointerCapture(ev.pointerId);
      } else if (S.mode === "mark") {
        if (!S.paper) { say("Lay the tracing paper on the grid first."); return; }
        S.traces.push({ uv: apply(inv(S.M), p), at: p }); draw(); say("Marked P" + S.traces.length + " at " + pt(p) + ".");
      } else if (S.mode === "center") {
        S.center = p; showTab("turn"); draw(); say("Center: " + pt(p) + ".");
      } else if (S.mode === "mirror") {
        if (S.pend.length && S.pend[0][0] === p[0] && S.pend[0][1] === p[1]) return;
        S.pend.push(p);
        if (S.pend.length === 2) { S.mirror = lineFrom({ type: "line", p: S.pend[0], q: S.pend[1] }); S.pend = []; showTab("flip"); say("Mirror: " + lineText(S.mirror) + "."); }
        else say("First mirror point " + pt(p) + ". Click a second point.");
        draw();
      }
    });
    ui.svg.addEventListener("pointermove", function (ev) {
      if (!S.drag) return;
      var w = toWorld(ev), dx = w[0] - S.drag.start[0], dy = w[1] - S.drag.start[1];
      if (S.snap) { dx = Math.round(dx); dy = Math.round(dy); } else { dx = Math.round(dx * 100) / 100; dy = Math.round(dy * 100) / 100; }
      S.drag.dx = dx; S.drag.dy = dy; S.drag.M = mul(translation(dx, dy), S.drag.M0); draw();
    });
    function endDrag() {
      var d = S.drag; if (!d) return; S.drag = null;
      if (d.dx || d.dy) { S.history.push({ M: S.M, n: S.log.length }); finish(d.M, slideText(d.dx, d.dy)); } else draw();
    }
    ui.svg.addEventListener("pointerup", endDrag);
    ui.svg.addEventListener("pointercancel", function () { S.drag = null; draw(); });
    var lastKey = 0;
    ui.svg.addEventListener("keydown", function (ev) {
      var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key];
      if (!d || !S.paper || S.busy) return;
      ev.preventDefault();
      var now = Date.now(), M2 = mul(translation(d[0], d[1]), S.M);
      if (now - lastKey < 800 && S.log.length && /^slide /.test(S.log[S.log.length - 1]) && S.history.length) {
        var prev = S.history[S.history.length - 1].M, dd = [S.M.e + d[0] - prev.e, S.M.f + d[1] - prev.f];
        S.M = clean(M2); S.log[S.log.length - 1] = slideText(dd[0], dd[1]); draw();
      } else { S.history.push({ M: S.M, n: S.log.length }); finish(M2, slideText(d[0], d[1])); }
      lastKey = now;
    });

    showTab("paper");
    setPreset(Math.max(0, presets.findIndex(function (p) { return p.id === opts.preset; })));

    return {
      setPreset: function (idOrIndex) {
        var i = typeof idOrIndex === "number" ? idOrIndex : presets.findIndex(function (p) { return p.id === idOrIndex; });
        if (i >= 0) setPreset(i);
      },
      state: function () { S.cell = CELL; return S; },
      destroy: function () { window.removeEventListener("resize", pinTop); host.innerHTML = ""; host.classList.remove("tp-root"); },
    };
  }

  // ------------------------------------------------------------------ modal wrapper (used by the book plugin)
  function openModal(opts) {
    var prev = document.activeElement;
    var overlay = el("div", { class: "tp-overlay" });
    var dlg = el("div", { class: "tp-dialog", role: "dialog", "aria-modal": "true", "aria-label": "Tracing paper" });
    var close = el("button", { type: "button", class: "tp-btn tp-close", text: "Close", "aria-label": "Close tracing paper" });
    var host = el("div", { class: "tp-host" });
    dlg.appendChild(close); dlg.appendChild(host); overlay.appendChild(dlg);
    document.body.appendChild(overlay);
    var inst = mount(host, opts);
    function shut() {
      document.removeEventListener("keydown", onKey, true);
      inst.destroy(); overlay.remove(); if (prev && prev.focus) prev.focus();
      if (opts && opts.onClose) opts.onClose();
    }
    function onKey(e) { if (e.key === "Escape") { e.stopPropagation(); shut(); } }
    document.addEventListener("keydown", onKey, true);
    close.addEventListener("click", shut);
    close.focus();
    inst.close = shut;
    return inst;
  }

  return {
    mount: mount, openModal: openModal,
    _math: { ID: ID, mul: mul, apply: apply, inv: inv, det: det, clean: clean, translation: translation, rotation: rotation, reflection: reflection,
      lineFrom: lineFrom, lineText: lineText, slideText: slideText, parsePoints: parsePoints, samePointSet: samePointSet },
  };
});
</script>
<script>
  // ?preset=parallel or #parallel picks a starting setup
  var want = new URLSearchParams(location.search).get("preset") || location.hash.replace(/^#/, "");
  window.tracingPaper = TracingPaper.mount(document.getElementById("app"), { presets: TRACING_PAPER_PRESETS, preset: want });
</script>
</body>
