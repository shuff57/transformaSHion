<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="mv-title mv-desc">
  <title id="mv-title">transformaSHion: slide, turn, flip</title>
  <desc id="mv-desc">On a dark graph grid, the letters SH lift out of the word and slide up to the right along a drawn arrow, turn half around inside a drawn arc, flip over a dashed mirror line, then slide home and flip face up into place. A caption names each move as it happens.</desc>

  <style>
    /* Intentionally dark: the diagram is the point, and the annotation ink stays legible. */
    svg {
      --loop: 7.2s;
      --ink: #faf9f5;
      --muted: #a3a199;
      --accent: #e0a96d;
      --bg: #26241d;
      --grid: rgba(250, 249, 245, 0.065);
      font-family: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
      text-rendering: geometricPrecision;
    }

    .bg { fill: var(--bg); }
    .grid { fill: url(#mv-grid); }
    #mv-grid path { stroke: var(--grid); stroke-width: 1; }

    .word { fill: var(--ink); font-size: 150px; }
    .sh-word { fill: var(--accent); }
    .ghost { fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-dasharray: 9 7; stroke-linejoin: round; opacity: 0; animation: ghost var(--loop) linear infinite; }
    @keyframes ghost {
      0%, 7%    { opacity: 0; }
      12%, 62%  { opacity: 0.45; }
      70%, 100% { opacity: 0; }
    }
    .rule { fill: var(--accent); opacity: 0.85; }

    .sh-move { transform-box: fill-box; transform-origin: 50% 50%; animation: sh-move var(--loop) infinite; }
    @keyframes sh-move {
      0%, 7%   { transform: translate(0, 0) rotate(0deg); animation-timing-function: cubic-bezier(0.45, 0, 0.15, 1); }
      20%      { transform: translate(180px, -175px) rotate(0deg); animation-timing-function: linear; }
      23%      { transform: translate(180px, -175px) rotate(0deg); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
      37%      { transform: translate(180px, -175px) rotate(180deg); animation-timing-function: linear; }
      47%      { transform: translate(180px, -175px) rotate(180deg); animation-timing-function: cubic-bezier(0.45, 0, 0.2, 1); }
      66%      { transform: translate(0, 0) rotate(360deg); animation-timing-function: linear; }
      100%     { transform: translate(0, 0) rotate(360deg); }
    }
    .sh-flip { transform-box: fill-box; transform-origin: 50% 50%; animation: sh-flip var(--loop) infinite; }
    @keyframes sh-flip {
      0%, 37%   { transform: scaleX(1); animation-timing-function: cubic-bezier(0.55, 0, 0.3, 1); }
      47%, 66%  { transform: scaleX(-1); animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); }
      76%, 100% { transform: scaleX(1); }
    }
    /* Face down: the SH turns into an outline, the way a flipped paper shows its back. */
    .sh-ink { fill-opacity: 1; stroke-opacity: 0; stroke: var(--accent); stroke-width: 1.5; animation: face var(--loop) linear infinite; }
    @keyframes face {
      0%, 40%   { fill-opacity: 1; stroke-opacity: 0; }
      44%, 68%  { fill-opacity: 0; stroke-opacity: 0.9; }
      73%, 100% { fill-opacity: 1; stroke-opacity: 0; }
    }

    /* The three annotations draw themselves above the word, then leave before the next beat. */
    .ann-slide, .ann-turn, .ann-flip { opacity: 0; }
    .ann-slide { animation: ann-slide var(--loop) linear infinite; }
    .ann-turn  { animation: ann-turn var(--loop) linear infinite; }
    .ann-flip  { animation: ann-flip var(--loop) linear infinite; }
    @keyframes ann-slide {
      0%, 7%    { opacity: 0; }
      10%, 20%  { opacity: 0.9; }
      27%, 100% { opacity: 0; }
    }
    @keyframes ann-turn {
      0%, 22%   { opacity: 0; }
      25%, 38%  { opacity: 0.9; }
      45%, 100% { opacity: 0; }
    }
    @keyframes ann-flip {
      0%, 36%   { opacity: 0; }
      39%, 50%  { opacity: 0.9; }
      56%, 100% { opacity: 0; }
    }
    .slide-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 350; stroke-dashoffset: 350; animation: draw-slide var(--loop) linear infinite; }
    @keyframes draw-slide {
      0%, 8%    { stroke-dashoffset: 350; }
      19%, 100% { stroke-dashoffset: 0; }
    }
    .slide-head, .turn-head { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
    .slide-head { animation: head-slide var(--loop) linear infinite; }
    .turn-head  { animation: head-turn var(--loop) linear infinite; }
    @keyframes head-slide { 0%, 16% { opacity: 0; } 19%, 100% { opacity: 1; } }
    @keyframes head-turn  { 0%, 33% { opacity: 0; } 36%, 100% { opacity: 1; } }
    .turn-arc { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 330; stroke-dashoffset: 330; animation: draw-turn var(--loop) linear infinite; }
    @keyframes draw-turn {
      0%, 23%   { stroke-dashoffset: 330; }
      36%, 100% { stroke-dashoffset: 0; }
    }
    .mirror { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 7 7; animation: draw-flip var(--loop) linear infinite; }
    @keyframes draw-flip {
      0%, 37%   { opacity: 0; }
      41%, 52%  { opacity: 1; }
      58%, 100% { opacity: 0; }
    }

    /* A caption under the word names the move that is running. */
    .cap { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; letter-spacing: 4px; text-transform: uppercase; text-anchor: middle; fill: var(--accent); opacity: 0; }
    .cap-slide { animation: cap-slide var(--loop) linear infinite; }
    .cap-turn  { animation: cap-turn var(--loop) linear infinite; }
    .cap-flip  { animation: cap-flip var(--loop) linear infinite; }
    .cap-home  { fill: var(--muted); animation: cap-home var(--loop) linear infinite; }
    @keyframes cap-slide { 0%, 8% { opacity: 0; } 11%, 19% { opacity: 0.9; } 24%, 100% { opacity: 0; } }
    @keyframes cap-turn  { 0%, 23% { opacity: 0; } 26%, 36% { opacity: 0.9; } 41%, 100% { opacity: 0; } }
    @keyframes cap-flip  { 0%, 38% { opacity: 0; } 41%, 50% { opacity: 0.9; } 55%, 100% { opacity: 0; } }
    @keyframes cap-home  { 0%, 73% { opacity: 0; } 76%, 86% { opacity: 0.9; } 92%, 100% { opacity: 0; } }

    .pulse { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: pulse var(--loop) cubic-bezier(0.2, 0.6, 0.2, 1) infinite; }
    @keyframes pulse {
      0%, 74%   { opacity: 0; transform: scale(0.96); }
      77%       { opacity: 0.5; }
      84%, 100% { opacity: 0; transform: scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ghost, .ann-slide, .ann-turn, .ann-flip, .cap, .pulse { display: none; }
      .sh-move, .sh-flip, .sh-ink { animation: none; }
    }
  </style>

  <defs>
    <pattern id="mv-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none"/>
    </pattern>
  </defs>

  <rect class="bg" width="1400" height="460"/>
  <rect class="grid" width="1400" height="460"/>

  <g aria-hidden="true">
    <g class="ann-slide">
      <path class="slide-line" d="M 929 348 L 1178 105"/>
      <path class="slide-head" d="M 1159.5 111.9 L 1178 105 L 1170.7 123.3"/>
    </g>
    <g class="ann-turn">
      <path class="turn-arc" d="M 1004 173 A 105 105 0 0 0 1214 173"/>
      <path class="turn-head" d="M 1204 189 L 1214 173 L 1224 189"/>
    </g>
    <g class="ann-flip">
      <line class="mirror" x1="1109" y1="48" x2="1109" y2="288"/>
    </g>
  </g>

  <text class="word" x="183.5" y="400" textLength="649.7" lengthAdjust="spacing">transforma</text>
  <text class="word" x="1024.9" y="400" textLength="191.7" lengthAdjust="spacing">ion</text>
  <text class="ghost" x="833.2" y="400" textLength="191.7" lengthAdjust="spacing">SH</text>
  <rect class="rule" x="854" y="413" width="150" height="3" rx="1.5"/>
  <rect class="pulse" x="825" y="285" width="208" height="128" rx="6"/>

  <g class="sh-move">
    <g class="sh-flip">
      <text class="word sh-word sh-ink" x="833.2" y="400" textLength="191.7" lengthAdjust="spacing">SH</text>
    </g>
  </g>

  <text class="cap cap-slide" x="700" y="444">slide</text>
  <text class="cap cap-turn" x="700" y="444">turn</text>
  <text class="cap cap-flip" x="700" y="444">flip</text>
  <text class="cap cap-home" x="700" y="444">in place</text>
</svg>
